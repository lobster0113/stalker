name: cloud

# Budget-guarded cloud launcher (#20, ADR 0004 §5): the only workflow that can spend money.
# Trigger: MCP `actions_run_trigger` (workflow_id cloud.yml, ref main) with inputs below.
# Daily schedule reaps orphan pods. Ledger lives on ops: budget/ledger.jsonl.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check | run | reap | collect | export"
        default: check
      job:
        description: "job spec path for mode=run (jobs/<name>.yaml)"
        default: ""
      dry_run:
        description: "mode=run: budget check only, no pod"
        type: boolean
        default: true
      collect_run:
        description: "mode=collect: run id of an earlier cloud.yml run whose result artifact is copied to ops"
        default: ""
      resume_run:
        description: "mode=run: run id of an earlier cloud.yml run of the same job; the pod continues its result (#354)"
        default: ""
      export_run:
        description: "mode=export: run id of an earlier mixn c1 cloud.yml run; its result becomes 2-6 handed web policy files (#588)"
        default: ""
      tier:
        description: "mode=export: the run's tier (beginner | mid | pro); another tier's result is refused"
        default: ""
      export_strategy:
        description: "mode=export: current | average strategy"
        default: current
      export_min_visits:
        description: "mode=export: drop keys updated fewer times (export_web_policy --min-visits)"
        default: "0"
      export_min_visits_by_players:
        description: "mode=export: per-seat-count min visits, e.g. 2:10,3:5,4:5,5:5,6:2 (others use export_min_visits); empty = none (#596)"
        default: ""
  schedule:
    - cron: "17 3 * * *"

# Never cancelled. Runs of different jobs go in parallel (#350): the ledger is union-merged on push
# and the launcher re-checks the cap after its reservation lands; the same job stays serial.
# check, reap, collect and export share one group.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'run') && format('cloud-run-{0}', inputs.job) || 'cloud-budget' }}
  cancel-in-progress: false

permissions:
  contents: write  # push ledger lines and results to ops
  actions: read    # mode=collect / export / resume_run: download an earlier run's cloud-result artifact (#264, #354, #588)

defaults:
  run:
    shell: bash

jobs:
  launch:
    runs-on: ubuntu-latest
    # GitHub-hosted runners cap a job at 360 min regardless; launcher MAX_JOB_MINUTES (330) leaves
    # room for setup, terminate and the ledger push, so its own deadline fires first.
    timeout-minutes: 355
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      # inputs go through env, not ${{ }} in scripts, so they cannot inject shell
      MODE: ${{ github.event_name == 'schedule' && 'reap' || inputs.mode }}
      JOB: ${{ inputs.job }}
      DRY_RUN: ${{ inputs.dry_run }}
      COLLECT_RUN: ${{ inputs.collect_run }}
      RESUME_RUN: ${{ inputs.resume_run }}
      EXPORT_RUN: ${{ inputs.export_run }}
      TIER: ${{ inputs.tier }}
      EXPORT_STRATEGY: ${{ inputs.export_strategy }}
      EXPORT_MIN_VISITS: ${{ inputs.export_min_visits }}
      EXPORT_MIN_VISITS_BY_PLAYERS: ${{ inputs.export_min_visits_by_players }}
      LEDGER: ${{ github.workspace }}/ops/budget/ledger.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ops worktree
        run: |
          git fetch -q origin ops
          git worktree add ops origin/ops -B ops
      - name: check resume_run
        if: env.MODE == 'run'
        run: '[[ -z "$RESUME_RUN" || "$RESUME_RUN" =~ ^[0-9]+$ ]] || { echo "resume_run must be a cloud.yml run id, got ''$RESUME_RUN''"; exit 1; }'
      - name: fetch resume result
        # the pod gets this file through its result server (launcher upload), never a GitHub credential
        if: env.MODE == 'run' && env.RESUME_RUN != ''
        uses: actions/download-artifact@v4
        with:
          name: cloud-result-${{ env.RESUME_RUN }}
          run-id: ${{ env.RESUME_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resume/
      - name: launcher
        run: |
          case "$MODE" in
            check) python harness/cloud/launcher.py check ;;
            reap)  python harness/cloud/launcher.py reap --ledger "$LEDGER" ;;
            run)
              # the start entry is pushed right after pod creation; a failed push terminates the pod
              # a spec with result_path gets its JSON pulled here (#184); the launcher checks size and secrets
              args=(run "$JOB" --ledger "$LEDGER" --run-id "$GITHUB_RUN_ID"
                    --sync-cmd "bash harness/cloud/push_ledger.sh ops 'cloud: reserve run $GITHUB_RUN_ID'"
                    --result-out "$RUNNER_TEMP/cloud-result/result.json" --journal "$GITHUB_WORKSPACE/ops/journal")
              [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
              [[ -n "$RESUME_RUN" ]] && args+=(--resume-file "$RUNNER_TEMP/resume/result.json" --resume-run "$RESUME_RUN")
              python harness/cloud/launcher.py "${args[@]}" ;;
            collect) [[ "$COLLECT_RUN" =~ ^[0-9]+$ ]] || { echo "collect_run must be a cloud.yml run id, got '$COLLECT_RUN'"; exit 1; } ;;
            export)
              [[ "$EXPORT_RUN" =~ ^[0-9]+$ ]] || { echo "export_run must be a cloud.yml run id, got '$EXPORT_RUN'"; exit 1; }
              [[ "$TIER" =~ ^(beginner|mid|pro)$ ]] || { echo "tier must be beginner|mid|pro, got '$TIER'"; exit 1; }
              [[ "$EXPORT_STRATEGY" =~ ^(current|average)$ ]] || { echo "export_strategy must be current|average, got '$EXPORT_STRATEGY'"; exit 1; }
              [[ "$EXPORT_MIN_VISITS" =~ ^[0-9]+$ ]] || { echo "export_min_visits must be a whole number, got '$EXPORT_MIN_VISITS'"; exit 1; }
              [[ -z "$EXPORT_MIN_VISITS_BY_PLAYERS" || "$EXPORT_MIN_VISITS_BY_PLAYERS" =~ ^[0-9]+:[0-9]+(,[0-9]+:[0-9]+)*$ ]] || { echo "export_min_visits_by_players must look like 2:10,3:5, got '$EXPORT_MIN_VISITS_BY_PLAYERS'"; exit 1; } ;;
            *) echo "mode must be check|run|reap|collect|export, got '$MODE'"; exit 1 ;;
          esac
      - name: terminate this run's pods (finally)
        if: always() && env.MODE == 'run' && env.DRY_RUN != 'true'
        # pod name comes from the launcher's own spec parser, never a separate shell parse
        run: python harness/cloud/launcher.py reap --ledger "$LEDGER" --force --job "$JOB" --run-id "$GITHUB_RUN_ID"
      - name: upload result
        if: always() && env.MODE == 'run' && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-result-${{ github.run_id }}
          path: ${{ runner.temp }}/cloud-result/
          if-no-files-found: ignore
          retention-days: 30
      - name: fetch earlier result
        if: env.MODE == 'collect'
        uses: actions/download-artifact@v4
        with:
          name: cloud-result-${{ inputs.collect_run }}
          run-id: ${{ inputs.collect_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cloud-result/
      - name: result to ops
        # agent sandboxes cannot download artifacts but read ops (#264); the launcher re-checks the JSON
        if: always() && (env.MODE == 'collect' || (env.MODE == 'run' && env.DRY_RUN != 'true'))
        run: |
          src="$RUNNER_TEMP/cloud-result/result.json"
          id="$GITHUB_RUN_ID"; [[ "$MODE" == collect ]] && id="$COLLECT_RUN"
          if [[ ! -f "$src" ]]; then
            echo "no result file for run $id"; [[ "$MODE" == collect ]] && exit 1; exit 0
          fi
          python harness/cloud/launcher.py publish "$src" --run-id "$id" --ops ops
      - name: check export artifact
        # no pod, no ledger line (#588): the runner splits an earlier result; a gone artifact fails here first
        if: env.MODE == 'export'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -q -e .
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPORT_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json" 2> "$RUNNER_TEMP/artifacts.err" || echo '{}' > "$RUNNER_TEMP/artifacts.json"
          # the not-found line stays first; gh api's own stderr (e.g. a permission error) follows it for diagnosis
          python -m stalker.tools.export_web_players check-artifact "$RUNNER_TEMP/artifacts.json" --run "$EXPORT_RUN" \
            || { [[ -s "$RUNNER_TEMP/artifacts.err" ]] && { echo "gh api stderr:"; cat "$RUNNER_TEMP/artifacts.err"; }; exit 1; }
      - name: fetch export source
        if: env.MODE == 'export'
        uses: actions/download-artifact@v4
        with:
          name: cloud-result-${{ env.EXPORT_RUN }}
          run-id: ${{ env.EXPORT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/export-src/
      - name: export web policies
        # files go to the web-policy artifact only; shipping them to web/app/policy/ is a PR (#588 out of scope)
        if: env.MODE == 'export'
        run: |
          python -m stalker.tools.export_web_players export --pod-result "$RUNNER_TEMP/export-src/result.json" \
            --run "$EXPORT_RUN" --tier "$TIER" --strategy "$EXPORT_STRATEGY" --min-visits "$EXPORT_MIN_VISITS" \
            --min-visits-by-players "$EXPORT_MIN_VISITS_BY_PLAYERS" --policies-out "ops/cloud/policies/$EXPORT_RUN" \
            --index-base web/app/policy/index.json --out-dir "$RUNNER_TEMP/web-policy" \
            --summary-out "ops/cloud/exports/$EXPORT_RUN.json"
      - name: upload web policies
        if: env.MODE == 'export'
        uses: actions/upload-artifact@v4
        with:
          name: web-policy-${{ env.EXPORT_RUN }}
          path: ${{ runner.temp }}/web-policy/
          if-no-files-found: error
          retention-days: 30
      - name: push ledger
        if: always() && env.MODE != 'check'
        run: 'bash harness/cloud/push_ledger.sh ops "cloud: ledger ($MODE, run $GITHUB_RUN_ID)"'
