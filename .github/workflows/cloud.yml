name: cloud

# Budget-guarded cloud launcher (#20, ADR 0004 §5): the only workflow that can spend money.
# Trigger: MCP `actions_run_trigger` (workflow_id cloud.yml, ref main) with inputs below.
# Daily schedule reaps orphan pods. Ledger lives on ops: budget/ledger.jsonl.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check | run | reap"
        default: check
      job:
        description: "job spec path for mode=run (jobs/<name>.yaml)"
        default: ""
      dry_run:
        description: "mode=run: budget check only, no pod"
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * *"

# One group, never cancelled: ledger read-modify-write must not interleave.
concurrency:
  group: cloud-budget
  cancel-in-progress: false

permissions:
  contents: write  # push ledger lines to ops

defaults:
  run:
    shell: bash

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 1500  # > max_minutes cap (1440) so the launcher's own deadline fires first
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      # inputs go through env, not ${{ }} in scripts, so they cannot inject shell
      MODE: ${{ github.event_name == 'schedule' && 'reap' || inputs.mode }}
      JOB: ${{ inputs.job }}
      DRY_RUN: ${{ inputs.dry_run }}
      LEDGER: ${{ github.workspace }}/ops/budget/ledger.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ops worktree
        run: |
          git fetch -q origin ops
          git worktree add ops origin/ops -B ops
      - name: launcher
        run: |
          case "$MODE" in
            check) python harness/cloud/launcher.py check ;;
            reap)  python harness/cloud/launcher.py reap --ledger "$LEDGER" ;;
            run)
              args=(run "$JOB" --ledger "$LEDGER" --run-id "$GITHUB_RUN_ID")
              [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
              python harness/cloud/launcher.py "${args[@]}" ;;
            *) echo "mode must be check|run|reap, got '$MODE'"; exit 1 ;;
          esac
      - name: terminate this run's pods (finally)
        if: always() && env.MODE == 'run' && env.DRY_RUN != 'true'
        run: |
          name=$(sed -n 's/^name: *//p' "$JOB" | head -1)
          python harness/cloud/launcher.py reap --ledger "$LEDGER" --force --name-prefix "stalker-$name-$GITHUB_RUN_ID"
      - name: push ledger
        if: always() && env.MODE != 'check'
        run: |
          cd ops
          git add budget/ledger.jsonl 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "stalker-ci"
          git config user.email "stalker-ci@users.noreply.github.com"
          git commit -qm "cloud: ledger ($MODE, run $GITHUB_RUN_ID)"
          for i in 1 2 3; do
            git push -q origin ops && exit 0
            git pull -q --rebase origin ops
          done
          echo "ledger push failed 3x — ledger lines are in this run's log"; cat budget/ledger.jsonl; exit 1
