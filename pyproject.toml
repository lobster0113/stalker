[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stalker"
version = "0.0.1"
description = "Tournament poker AI research & training system, developed autonomously by an agent harness"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pokerkit==0.7.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "hypothesis>=6", "pytest-xdist>=3"]  # pyyaml: workflow YAML validity test (tests/test_harness.py); hypothesis: engine property tests; pytest-xdist: full-gate tests across cores (#167)
rl = ["torch>=2.2"]  # CPU policy network (stalker/rl/policy.py); not needed for the engine or gates
fast = ["numba>=0.60"]  # compiled evaluator for training loops (stalker/core/fast_eval.py, ADR 0013); optional, same results without it

[tool.setuptools.packages.find]
include = ["stalker*", "referee*"]

[tool.setuptools.package-data]
stalker = ["data/*.json", "tournament/presets/*.json"]
referee = ["anchors/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (excluded from quick gate)"]
