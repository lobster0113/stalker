[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stalker"
version = "0.0.1"
description = "Tournament poker AI research & training system, developed autonomously by an agent harness"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["stalker*", "referee*"]

[tool.setuptools.package-data]
stalker = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (excluded from quick gate)"]
