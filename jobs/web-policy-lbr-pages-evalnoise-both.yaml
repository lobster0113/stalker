# #756 (#746 follow-up): same as web-policy-lbr-pages-evalnoise but --backoff both (default), so the backoff-on cells (what the service uses)
# get their eval-seed sd and minimum k too; legacy mid-6 has no on cell (#702). Original header follows.
# #731 (#384 evaluation): eval-noise split. Same target as web-policy-lbr-pages (the served web/app/policy pages, --from-pages) with the
# policy files fixed and only the evaluation seed varied: --seeds 4 = eval seeds 10001-10004, backoff on and off (--backoff both).
# 5 player counts x 4 seeds = 20 cells over 32 workers. Why: ADR 0020 margins are inside 1 se for many cells, so one eval seed cannot
# separate pass from miss; the sd across eval seeds says how many seeds a verdict needs.
# Measurement runs under run_stages (#847): a failing run is retrieved as stalker.cloud.stage-failure (exit 0).
# Worst case = hourly_usd * max_minutes / 60 = 1.2 * 150 / 60 = $3.00 (expected ~$1). Result: ops:cloud/results/<run id>.json
name: web-policy-lbr-pages-evalnoise-both
image: python:3.12-slim
command: set -e; python3 -c "import io,tarfile,urllib.request as u; t=tarfile.open(fileobj=io.BytesIO(u.urlopen('https://codeload.github.com/lobster0113/stalker/tar.gz/refs/heads/main').read())); t.extractall('/src', filter='data')"; cd /src/stalker-main; pip install -q -e '.[fast]'; python3 -m stalker.tools.run_stages --out /result/web-policy-lbr-pages-evalnoise-both.json --stage 'lbr=python3 -m stalker.tools.web_policy_lbr_job --from-pages web/app/policy --workers 32 --seeds 4 --backoff both --out /result/web-policy-lbr-pages-evalnoise-both.json'
cpu_flavors: [cpu5c, cpu3c]
flavor_hourly_usd: [1.2, 1.0]
vcpu: 32
disk_gb: 10
max_minutes: 150
hourly_usd: 1.2
est_cost_usd: 1.0
result_path: /result/web-policy-lbr-pages-evalnoise-both.json
