# #926 (ADR 0027 decision 4, F6b): arm B (warm start) seed 1 of the A/B. The same command as arm A
# (e3-tp-mid-c1-sng-bubble-pod32, #901) with --seed 1, the output name and --prior-result "$STALKER_RESUME" in place of
# the resume flag (tests/test_sng_bubble_ab_jobs.py pins that); reading the prior is inside the --minutes clock (same
# compute). Dispatch with resume_run=41813684540: the launcher trims that result to RESUME_FIELDS (model and
# checkpoint stay, so pod_train read_prior reads it) and gzips it into $STALKER_RESUME; the command exits 3 at once
# when it is empty.
# Prior choice: 41813684540 is the 40k-iteration mid c1 mixn (2-6) cash run, seed 4 (#558; 1.27M infosets, real menu,
# no raise cap, key c1 v1 as this run). Its checkpoint b64 is 95,196,812 chars (ops:cloud/results/41813684540.summary.json);
# base64 of an npz gzips back to about 3/4, ~72 MB, under RESUME_MAX_BYTES (95 MB). The 120k run 42591543123 is
# 220,621,820 chars (npz 165 MB, its checkpoint_note already says no pod can resume from it) -> over the cap.
# The artifact cloud-result-41813684540 is kept 30 days from 11-04 -> expires ~12-04; dispatch dry_run=true first
# (it checks the upload size). Dispatch alone (#877: two jobs at once got a 429).
# Worst case = hourly_usd * max_minutes / 60 = 1.2 * 180 / 60 = $3.60.
# #941: median_iters_per_s 12 = a little above the normal-host range of the F6b runs (11.36-11.84 it/s, final means from
# ops:cloud/results/*.summary.json: 43735226442, 43837141334, 43842144620; non-CI reference values) so the launcher's 0.6x threshold
# (7.2 it/s) also catches the three slow cpu3c hosts (6.25-7.09: 43847129076, 43855130625, 43863826212) and stays under the slowest
# normal host. The launcher reads the FIRST progress line, which can differ from the final mean.
name: e3-tp-mid-c1-sng-bubble-prior-s1-pod32
image: python:3.12-slim
command: set -e; test -n "$STALKER_RESUME" || { echo "STALKER_RESUME empty - dispatch with resume_run=41813684540 (the warm-start prior)" >&2; exit 3; }; python3 -c "import io,tarfile,urllib.request as u; t=tarfile.open(fileobj=io.BytesIO(u.urlopen('https://codeload.github.com/lobster0113/stalker/tar.gz/refs/heads/main').read())); t.extractall('/src', filter='data'); open('/src/SHA','w').write(t.pax_headers.get('comment',''))"; cd /src/stalker-main; pip install -q -e '.[fast]'; python3 -m stalker.tools.pod_train --tier mid --players 4 --workers 16 --minutes 60 --max-iters 20000 --batch 500 --seed 1 --menu real --no-raise-cap --ranges average --avg-rule own --key-variant c1 --payoff icm --preset 9max_sng_503020 --stage b --level-index 0 --lam 0 --stacks bubble:skewed --lbr-hands 600 --sha-file /src/SHA --prior-result "$STALKER_RESUME" --out /result/e3-tp-mid-c1-sng-bubble-prior-s1-pod32.json
cpu_flavor: cpu3c
vcpu: 32
disk_gb: 10
max_minutes: 180
hourly_usd: 1.2
median_iters_per_s: [12]
result_path: /result/e3-tp-mid-c1-sng-bubble-prior-s1-pod32.json
