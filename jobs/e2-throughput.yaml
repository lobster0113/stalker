# E2 throughput pilot (#179, ADR 0012 E2-2): a fixed MCCFR workload, so pod minutes / iterations
# give iterations per second and dollars per 10^6 iterations without fetching any output.
# Worst case = hourly_usd * max_minutes / 60 = $0.06.
name: e2-throughput
image: python:3.12
command: pip install -q "git+https://github.com/lobster0113/stalker@main" && python -m stalker.e2.mccfr --iters 20000 --seed 1
cpu_flavor: cpu3c
vcpu: 2
disk_gb: 10
max_minutes: 30
hourly_usd: 0.12
