# #916 (ADR 0026 lambda selection, ADR 0027 F7a): the lambda grid played by the F5 tournament policy (run 43735226442,
# 503020 bubble 4 survivors, lam 0, cold) on every seat. Dispatch with resume_run=43735226442: the policy table is over
# 1 MB, so it is only in the artifact cloud-result-43735226442 (expires ~12-15); the launcher hands it over trimmed and
# gzipped as $STALKER_RESUME, and the command fails at once (test -n) when it is empty.
# --games 1000 as the random/tag baselines (#870/#877, docs/research/2026-11-icm-lambda-baseline.md); --seed 10001 is
# the F5 evaluation seed (the baselines used 0). One preset x remaining 4 x 3 profiles x 3 layouts = 9 cells, 9000 games.
# Local reference (not CI): policy seats cost ~0.6 s/game with numba (~3.5 s without: the c1 key's equity steps), so
# ~90 min single-process -> install .[fast]; max_minutes 240 leaves slack for a slower host. 4 vCPU for memory headroom
# (the F5 table has 10.8M nodes; its training pod peaked at 2.2 GB RSS).
# run_stages --deadline-s 12600 (= 240*60 - 1800 s) stops the grid 30 min before the pod limit so a timeout still
# yields a stage-failure result; the measurement stage first prints `t0=... stage_start=...` to stderr.
# Worst case = hourly_usd * max_minutes / 60 = 0.24 * 240 / 60 = $0.96 (probe limit $1, tests/test_cloud_launcher.py). Dispatch alone (#877: two jobs at once got a 429).
# Result: ops:cloud/results/<run id>.json, schema stalker.icm.lambda-grid-pair with the single agent `policy`.
name: e3-sng-bubble-lambda-policy
image: python:3.12-slim
command: set -e; test -n "$STALKER_RESUME" || { echo "STALKER_RESUME empty - dispatch with resume_run=43735226442" >&2; exit 3; }; mkdir -p /src; date -u +%s > /src/t0; python3 -c "import io,tarfile,urllib.request as u; t=tarfile.open(fileobj=io.BytesIO(u.urlopen('https://codeload.github.com/lobster0113/stalker/tar.gz/refs/heads/main').read())); t.extractall('/src', filter='data')"; cd /src/stalker-main; pip install -q -e '.[fast]'; python3 -m stalker.tools.run_stages --out /result/e3-sng-bubble-lambda-policy.json --deadline-s 12600 --stage 'policy=echo t0=$(cat /src/t0) stage_start=$(date -u +%s) >&2; python3 -m stalker.tools.icm_grid --presets 9max_sng_503020 --remaining 4 --profiles even,random,skewed --layouts 3 --level-index 0 --games 1000 --seed 10001 --agents "policy:$STALKER_RESUME" --lambda-grid --out /src/policy.json' --stage 'pair=python3 -m stalker.tools.icm_grid_pair --out /result/e3-sng-bubble-lambda-policy.json policy=/src/policy.json'
cpu_flavor: cpu3c
vcpu: 4
disk_gb: 10
max_minutes: 240
hourly_usd: 0.24
result_path: /result/e3-sng-bubble-lambda-policy.json
