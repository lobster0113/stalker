# #957 (ADR 0027 decision 2 step 2, F11a): 9-max 50/30/20 SNG in the money, 2 survivors (r=2), c1 key slot tm0, pure ICM
# reward (lam 0: g = 0 off the bubble, so lam does nothing), cold start (the #937 step-1 A/B chose cold in all 3 pairs,
# ADR 0027 decision 4 carries it to steps 2-3). Flags as e3-tp-mid-c1-sng-bubble-pod32 except --players, --stage m,
# --out/result_path/name, --lbr-hands and median_iters_per_s. --stacks bubble:skewed kept (the bubble job's profile).
# Heads-up ICM with 50/30/20 is 0.3 + 0.2 * chip share, so the reward is 0.2 * chip change / table chips: chip EV up to
# a per-hand scale (tests/test_sng_mid_jobs.py). Trained anyway so the m stage has its own r=2 table in the same frame.
# --minutes 60 / --max-iters 20000 kept from the bubble job (same budget per stage); the result's stopped_by says which
# one ended training. Estimated 8.5-8.9 it/s on a normal host -> 20000 iters in ~35-40 min, a slow host hits --minutes.
# --lbr-hands 2000 = train_jobs.E3_BY_PLAYERS_LBR_HANDS_BY_N[2] (#556: at 600 the 2-3 seat LBR se was the seed sd).
# median_iters_per_s 9: local 1-worker it/s at the same flags (non-CI reference, 3 runs side by side, 150 iters):
# 4p 0.36, 3p 0.29, 2p 0.27; 2/4 = 0.27/0.36 = 0.75. Fewer survivors share the same chips, so stacks are deeper in BB and
# hands longer. 0.75 x the F6b normal-host range 11.36-11.84 = 8.5-8.9; 9 sits just above it like the bubble job's
# 12 (#941), so the launcher's 0.6x threshold (5.4 it/s; F6b slow hosts 6.25-7.09 x 0.75 = 4.7-5.3 fall under it) is under the slowest normal host. Set from the first run.
