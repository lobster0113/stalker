# #708 (#692 follow-up 2): same as web-policy-lbr-mid.yaml (ADR 0020 hands/seeds, backoff off and on, 32 workers) but on
# the 120k filtered web policies that #714 re-exported to ops:cloud/policies/42591543123/mid-{2..6}.json.
# Only POLICY_RUN and the result file name differ from web-policy-lbr-mid.yaml.
# Worst case = hourly_usd * max_minutes / 60 = 1.2 * 150 / 60 = $3.00 (expected ~$0.1, like #669 $0.05 and #674 $0.08).
# Result: ops:cloud/results/<run id>.json
name: web-policy-lbr-mid-s4long
image: python:3.12-slim
command: set -e; python3 -c "import io,tarfile,urllib.request as u; t=tarfile.open(fileobj=io.BytesIO(u.urlopen('https://codeload.github.com/lobster0113/stalker/tar.gz/refs/heads/main').read())); t.extractall('/src', filter='data')"; cd /src/stalker-main; pip install -q -e '.[fast]'; POLICY_RUN=42591543123; python3 -m stalker.tools.web_policy_lbr_job --policy-run $POLICY_RUN --workers 32 --out /result/web-policy-lbr-mid-s4long.json
cpu_flavors: [cpu5c, cpu3c]
flavor_hourly_usd: [1.2, 1.0]
vcpu: 32
disk_gb: 10
max_minutes: 150
hourly_usd: 1.2
est_cost_usd: 1.0
result_path: /result/web-policy-lbr-mid-s4long.json
